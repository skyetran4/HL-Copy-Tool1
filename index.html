<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartland Cardiology Copy Tool</title>
<style>
  :root {
    --bg: #fff3f7;
    --card: #ffffff;
    --ink: #3b1a2b;
    --muted: #8a5a72;
    --line: #f5cfdd;
    --accent: #d6336c;
    --accent-ink: #ffffff;
    --accent-soft: #fde4ee;
    --ok: #1d6b45;
    --fill: #e6f2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a1220; --card: #3a1a2d; --ink: #ffe9f1; --muted: #d9a7be;
      --line: #5c2c47; --accent: #f06292; --accent-ink: #ffffff;
      --accent-soft: #4a1f37; --ok: #5fc08f; --fill: #1f3329;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 120px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 2px solid var(--line); padding: 12px 20px;
  }
  .bar-inner { max-width: 1100px; margin: 0 auto; }
  #search {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  #nav { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: .875rem;
    color: var(--ink); text-decoration: none; background: var(--card); border: 1px solid var(--line);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 20px 80px; }
  .category h2 {
    font-size: 1.25rem; margin: 32px 0 12px; padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid #f48fb1; border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .card[hidden], .category[hidden], #empty[hidden], #nav[hidden] { display: none; }
  .card h3 { margin: 0; font-size: 1rem; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .fields input {
    padding: 9px 10px; font: inherit; font-size: .9rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-width: 0;
  }
  input:focus-visible, button:focus-visible, .chip:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .preview {
    margin: 0; padding: 12px; background: var(--bg); border-radius: 6px;
    font-size: .95rem; flex: 1; overflow-wrap: anywhere;
  }
  .preview .empty { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }
  .preview .filled { background: var(--fill); border-radius: 3px; padding: 0 2px; }
  .copy {
    align-self: flex-start; min-width: 120px; padding: 10px 18px; font: inherit; font-weight: 600;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  .copy:hover { filter: brightness(1.1); }
  .copy.done { background: var(--ok); }
  #empty { text-align: center; color: var(--muted); padding: 48px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    font-size: .9rem; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) {
    h1 { font-size: 1.4rem; }
    .copy { align-self: stretch; padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; } #toast { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1>💖 Heartland Cardiology Copy Tool</h1>
  <p>Fill in the fields, then press Copy. Blank fields keep their [bracket] text.</p>
</header>
<div class="bar">
  <div class="bar-inner">
    <input id="search" type="search" placeholder="Search templates" aria-label="Search templates" autocomplete="off">
    <nav id="nav" aria-label="Categories"></nav>
  </div>
</div>
<main>
  <div id="app"></div>
  <p id="empty" hidden>No templates match your search.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
